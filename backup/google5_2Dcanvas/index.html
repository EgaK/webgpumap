<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU Canvas-Texture Concave Polygon Demo</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #1a1a1a;
        font-family: sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #instructions {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        background: rgba(0, 0, 0, 0.7);
        padding: 15px;
        border-radius: 8px;
        pointer-events: none;
      }
      h1 {
        margin: 0 0 10px 0;
        font-size: 16px;
      }
      p {
        margin: 5px 0;
        font-size: 14px;
        color: #ccc;
      }
    </style>
  </head>
  <body>
    <div id="instructions">
      <h1>WebGPU ＋ Canvas2Dハイブリッド構成</h1>
      <p>
        🎨 <b>処理:</b> 座標からCanvas2Dでマスクを生成 ➡️
        WebGPUテクスチャとして描画
      </p>
      <p>🖱️ <b>ドラッグ:</b> 移動 / 📜 <b>ホイール:</b> マウス位置ズーム</p>
    </div>

    <!-- WebGPUを表示するメインのCanvas -->
    <canvas id="gpuCanvas"></canvas>

    <script type="module">
      const dpr = window.devicePixelRatio || 1;

      // ==========================================
      // 外部から与える「頂点座標のみ」の配列（例: アルファベットの「C」のような凹多角形）
      // 座標範囲: -1.0 〜 1.0 の間で定義
      // ==========================================
      const externalVertices = [
        -0.6, -0.6, -0.6, 0.6, 0.6, 0.6, 0.6, 0.3, -0.2, 0.3, -0.2, -0.3, 0.6,
        -0.3, 0.6, -0.6,
      ];

      // インタラクション用の状態管理
      let offsetX = 0.0;
      let offsetY = 0.0;
      let scale = 1.0;
      let isDragging = false;
      let previousMousePosition = { x: 0, y: 0 };

      // 1. データの取得用（裏画面でポリゴンを描画するため）の隠しCanvasを作成
      const textureSize = 1024;
      const tempCanvas = document.createElement("canvas");
      tempCanvas.width = textureSize;
      tempCanvas.height = textureSize;
      const tempCtx = tempCanvas.getContext("2d");

      // 2. Canvasのfill()を使ってポリゴンをラスタライズ（描画）する関数
      // 隠しCanvasのサイズを画面サイズ（高解像度DPR考慮）に同期させる
      function updateTextureSize() {
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
      }

      function generatePolygonTexture() {
        tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);

        tempCtx.beginPath();

        // WebGPUの NDC座標系 (-1〜1) ＋ 移動・拡大 を Canvas2Dのピクセル座標に変換
        // WebGPUの頂点シェーダーで行っている計算をCanvas2Dでシミュレートします
        const halfW = tempCanvas.width / 2;
        const halfH = tempCanvas.height / 2;

        for (let i = 0; i < externalVertices.length; i += 2) {
          // WebGPU上の変形を適用
          const rawX = externalVertices[i] * scale + offsetX;
          const rawY = externalVertices[i + 1] * scale + offsetY;

          // NDC座標から画面のピクセル座標へ変換
          const screenX = ((rawX + 1.0) * halfW) / dpr;
          const screenY = ((-rawY + 1.0) * halfH) / dpr; // Y軸反転

          if (i === 0) tempCtx.moveTo(screenX, screenY);
          else tempCtx.lineTo(screenX, screenY);
        }
        tempCtx.closePath();

        tempCtx.fillStyle = "#ff6600";
        tempCtx.fill();
        tempCtx.strokeStyle = "#ffffff";
        tempCtx.lineWidth = 2;
        tempCtx.stroke();
      }

      // 初回のテクスチャ画像作成
      generatePolygonTexture();

      async function initWebGPU() {
        if (!navigator.gpu) return alert("WebGPU未対応のブラウザです。");
        const adapter = await navigator.gpu.requestAdapter();
        const device = await adapter.requestDevice();

        const canvas = document.getElementById("gpuCanvas");
        const context = canvas.getContext("webgpu");
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;

        const canvasFormat = navigator.gpu.getPreferredCanvasFormat();
        context.configure({
          device,
          format: canvasFormat,
          alphaMode: "opaque",
        });

        // --- WGSLシェーダー (テクスチャマッピング用) ---
        const shaderModule = device.createShaderModule({
          code: `
                    struct Uniforms { offset: vec2<f32>, scale: f32 }
                    @binding(0) @group(0) var<uniform> uniforms : Uniforms;
                    @binding(1) @group(0) var mySampler: sampler;
                    @binding(2) @group(0) var myTexture: texture_2d<f32>;

                    struct VertexOutput {
                        @builtin(position) position : vec4<f32>,
                        @location(0) uv : vec2<f32>,
                    }

                    @vertex
                    fn vs_main(@location(0) pos: vec2<f32>, @location(1) uv: vec2<f32>) -> VertexOutput {
                        var output: VertexOutput;
                        let transformedPos = (pos * uniforms.scale) + uniforms.offset;
                        output.position = vec4<f32>(transformedPos, 0.0, 1.0);
                        output.uv = uv;
                        return output;
                    }

                    @fragment
                    fn fs_main(@location(0) uv: vec2<f32>) -> @location(0) vec4<f32> {
                        let color = textureSample(myTexture, mySampler, uv);
                        if (color.a < 0.05) { discard; }
                        return color;
                    }
                `,
        });

        // --- テクスチャを貼り付けるための「四角形」の頂点データ ---
        const quadVertices = new Float32Array([
          -1.0,
          1.0,
          0.0,
          0.0, // 左上
          -1.0,
          -1.0,
          0.0,
          1.0, // 左下
          1.0,
          1.0,
          1.0,
          0.0, // 右上
          1.0,
          -1.0,
          1.0,
          1.0, // 右下
        ]);

        const vertexBuffer = device.createBuffer({
          size: quadVertices.byteLength,
          usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
        });
        device.queue.writeBuffer(vertexBuffer, 0, quadVertices);

        // --- WebGPUテクスチャの作成とCanvasデータの転送 ---
        const gpuTexture = device.createTexture({
          size: [textureSize, textureSize, 1],
          format: "rgba8unorm",
          // 💡 修正: GPUBufferUsage ではなく GPUTextureUsage を使用します
          usage:
            GPUTextureUsage.TEXTURE_BINDING |
            GPUTextureUsage.COPY_DST |
            GPUTextureUsage.RENDER_ATTACHMENT,
        });

        device.queue.copyExternalImageToTexture(
          { source: tempCanvas, flipY: false },
          { texture: gpuTexture },
          [textureSize, textureSize, 1],
        );

        const sampler = device.createSampler({
          magFilter: "linear",
          minFilter: "linear",
        });
        const uniformBuffer = device.createBuffer({
          size: 16,
          usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
        });

        // パイプライン・レイアウト設定
        const bindGroupLayout = device.createBindGroupLayout({
          entries: [
            {
              binding: 0,
              visibility: GPUShaderStage.VERTEX,
              buffer: { type: "uniform" },
            },
            {
              binding: 1,
              visibility: GPUShaderStage.FRAGMENT,
              sampler: { type: "filtering" },
            },
            {
              binding: 2,
              visibility: GPUShaderStage.FRAGMENT,
              texture: {
                sampleType: "float",
                viewDimension: "2d",
                multisampled: false,
              },
            },
          ],
        });

        const bindGroup = device.createBindGroup({
          layout: bindGroupLayout,
          entries: [
            { binding: 0, resource: { buffer: uniformBuffer } },
            { binding: 1, resource: sampler },
            { binding: 2, resource: gpuTexture.createView() },
          ],
        });

        const renderPipeline = device.createRenderPipeline({
          layout: device.createPipelineLayout({
            bindGroupLayouts: [bindGroupLayout],
          }),
          vertex: {
            module: shaderModule,
            entryPoint: "vs_main",
            buffers: [
              {
                arrayStride: 16,
                attributes: [
                  { shaderLocation: 0, offset: 0, format: "float32x2" },
                  { shaderLocation: 1, offset: 8, format: "float32x2" },
                ],
              },
            ],
          },
          fragment: {
            module: shaderModule,
            entryPoint: "fs_main",
            targets: [
              {
                format: canvasFormat,
                // 💡 追記: テクスチャの透明度（アルファチャンネル）をWebGPU背景と綺麗にブレンドする設定
                blend: {
                  color: {
                    srcFactor: "src-alpha",
                    dstFactor: "one-minus-src-alpha",
                    operation: "add",
                  },
                  alpha: {
                    srcFactor: "one",
                    dstFactor: "one-minus-src-alpha",
                    operation: "add",
                  },
                },
              },
            ],
          },
          primitive: { topology: "triangle-strip" },
        });

        // --- インタラクション制御 ---
        function getNDCCoordinates(clientX, clientY) {
          const rect = canvas.getBoundingClientRect();
          return {
            x: ((clientX - rect.left) / canvas.width) * 2 * dpr - 1,
            y: -(((clientY - rect.top) / canvas.height) * 2 * dpr - 1),
          };
        }

        canvas.addEventListener("mousedown", (e) => {
          isDragging = true;
          previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener("mousemove", (e) => {
          if (!isDragging) return;
          offsetX +=
            ((e.clientX - previousMousePosition.x) / canvas.width) * 2 * dpr;
          offsetY -=
            ((e.clientY - previousMousePosition.y) / canvas.height) * 2 * dpr;
          previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener("mouseup", () => (isDragging = false));

        canvas.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            const mouseNDC = getNDCCoordinates(e.clientX, e.clientY);
            const newScale = e.deltaY < 0 ? scale * 1.1 : scale / 1.1;
            offsetX = mouseNDC.x - (mouseNDC.x - offsetX) * (newScale / scale);
            offsetY = mouseNDC.y - (mouseNDC.y - offsetY) * (newScale / scale);
            scale = newScale;
          },
          { passive: false },
        );

        window.addEventListener("resize", () => {
          canvas.width = window.innerWidth * dpr;
          canvas.height = window.innerHeight * dpr;
        });
        // --- 描画ループ ---
        function render() {
          // 1. Canvas2D側で現在のズーム状態のポリゴンを描画
          generatePolygonTexture();

          // 2. 更新されたCanvasの絵をWebGPUのテクスチャへ毎フレーム高速転送
          device.queue.copyExternalImageToTexture(
            { source: tempCanvas, flipY: false },
            { texture: gpuTexture },
            [gpuTexture.width, gpuTexture.height, 1],
          );
          // ユニフォームバッファに変形マトリックスの代わりとなる位置と拡大率を転送
          device.queue.writeBuffer(
            uniformBuffer,
            0,
            new Float32Array([offsetX, offsetY, scale, 0.0]),
          );

          const commandEncoder = device.createCommandEncoder();
          const renderPass = commandEncoder.beginRenderPass({
            colorAttachments: [
              {
                view: context.getCurrentTexture().createView(),
                clearValue: { r: 0.1, g: 0.1, b: 0.1, a: 1.0 }, // 背景色
                loadOp: "clear",
                storeOp: "store",
              },
            ],
          });

          // パイプラインと各種リソース（頂点、テクスチャ等）をセットして描画
          renderPass.setPipeline(renderPipeline);
          renderPass.setVertexBuffer(0, vertexBuffer);
          renderPass.setBindGroup(0, bindGroup);
          renderPass.draw(4); // 四角形の4つの頂点を描画

          renderPass.end();
          device.queue.submit([commandEncoder.finish()]);

          // 次のフレームの描画を要求
          requestAnimationFrame(render);
        }

        // 初回の描画ループを開始
        requestAnimationFrame(render);
      }

      // 全体の初期化処理を実行
      initWebGPU();
    </script>
  </body>
</html>
