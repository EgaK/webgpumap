<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU Image Crop & Zoom</title>
    <style>
      body {
        margin: 0;
        background-color: #222;
        /*display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;*/
        overflow: hidden;
        color: white;
        font-family: sans-serif;
      }
      canvas {
        border: 2px solid #555;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
    </style>
  </head>
  <body>
    <div style="margin-bottom: 10px; color: white">
      <label for="canvas-height">Canvasの高さ: </label>
      <input
        type="number"
        id="canvas-height"
        value="600"
        min="200"
        max="2000"
        step="50"
      />
      px
    </div>
    <canvas id="webgpu-canvas" width="800" height="600"></canvas>

    <script type="module">
      // ==========================================
      // 1. WebGPU の初期化とデバイス取得
      // ==========================================
      const canvas = document.getElementById("webgpu-canvas");
      if (!navigator.gpu) {
        alert("お使いのブラウザはWebGPUに対応していません。");
        throw new Error("WebGPU not supported");
      }

      const adapter = await navigator.gpu.requestAdapter();
      const device = await adapter.requestDevice();
      const context = canvas.getContext("webgpu");
      const format = navigator.gpu.getPreferredCanvasFormat();

      context.configure({
        device: device,
        format: format,
        alphaMode: "opaque",
      });

      // ==========================================
      // 2. WGSL シェーダーの定義
      // ==========================================
      const shaderModule = device.createShaderModule({
        code: `
                    struct Transform {
                        u_offset: vec2<f32>,
                        u_scale: vec2<f32>,
                        u_canvas_size: vec2<f32>,
                    };

                    @group(0) @binding(0) var<uniform> transform: Transform;

                    struct VertexInput {
                        @location(0) position: vec2<f32>,
                        @location(1) prev: vec2<f32>,
                        @location(2) next: vec2<f32>,
                        @location(3) direction: f32,
                    };

                    struct VertexOutput {
                        @builtin(position) position: vec4<f32>,
                    };

                    @vertex
                    fn vs_main(input: VertexInput) -> VertexOutput {
                        var output: VertexOutput;

                        // ズーム・移動状態の仮想ピクセル座標を計算
                        let p_curr = (input.position - transform.u_offset) / transform.u_scale;
                        let p_prev = (input.prev - transform.u_offset) / transform.u_scale;
                        let p_next = (input.next - transform.u_offset) / transform.u_scale;

                        let v_in  = normalize(p_curr - p_prev);
                        let v_out = normalize(p_next - p_curr);

                        let n_in  = vec2<f32>(-v_in.y, v_in.x);
                        let n_out = vec2<f32>(-v_out.y, v_out.x);

                        let miter = normalize(n_in + n_out);

                        // 線の太さの半分（20ピクセル）
                        const HALF_THICKNESS: f32 = 2.0;
                        let miter_length = HALF_THICKNESS / dot(miter, n_in);

                        let final_pixel_pos = p_curr + miter * miter_length * input.direction;

                        // WebGPUのクリップ空間座標に変換
                        let clip_x = (final_pixel_pos.x / transform.u_canvas_size.x) * 2.0 - 1.0;
                        let clip_y = 1.0 - (final_pixel_pos.y / transform.u_canvas_size.y) * 2.0;

                        output.position = vec4<f32>(clip_x, clip_y, 0.0, 1.0);
                        return output;
                    }

                    @fragment
                    fn fs_main() -> @location(0) vec4<f32> {
                        return vec4<f32>(0.0, 1.0, 0.8, 1.0);
                    }
                `,
      });

      // ==========================================
      // 3. 固定頂点バッファの作成（大量のポリゴン・折れ線パスを生成）
      // ==========================================

      // 🌟 検証用のポリゴン（線）の数を定義
      // 50,000を指定すると、Top/Bottomで10万頂点（約10万ポリゴン）になります。
      // iPhoneの性能に合わせて 10,000 ～ 100,000 の間で調整してみてください。
      const TOTAL_POINTS = 1000000;

      const points = [];
      let currentX = 100;
      let currentY = 300;

      // 1. ブラウン運動（ランダムウォーク）アルゴリズムで、画面内を複雑にうねる巨大な折れ線を自動生成
      for (let i = 0; i < TOTAL_POINTS; i++) {
        points.push({ x: currentX, y: currentY });

        // 次の点の座標をランダムに決定（1000x1000の仮想空間内に収まるように移動）
        currentX += (Math.random() - 0.45) * 30;
        currentY += (Math.random() - 0.5) * 30;

        // 画面外に行き過ぎないように制御
        if (currentX < 0 || currentX > 1000) currentX = Math.random() * 1000;
        if (currentY < 0 || currentY > 1000) currentY = Math.random() * 1000;
      }

      // 2. 高速化された頂点バッファ生成関数
      function buildMassiveLineVertices(pathPoints) {
        const len = pathPoints.length;
        // 1頂点あたり7つのfloat（28バイト）× 2（TopとBottom）× 全点数 分のメモリを最初から一発で確保（高速化）
        const stripData = new Float32Array(len * 2 * 7);
        let offset = 0;

        for (let i = 0; i < len; i++) {
          const curr = pathPoints[i];

          // 始点と終点の隣接点の計算
          const prev =
            i === 0
              ? {
                  x: curr.x - (pathPoints[1].x - curr.x),
                  y: curr.y - (pathPoints[1].y - curr.y),
                }
              : pathPoints[i - 1];

          const next =
            i === len - 1
              ? {
                  x: curr.x + (curr.x - pathPoints[len - 2].x),
                  y: curr.y + (curr.y - pathPoints[len - 2].y),
                }
              : pathPoints[i + 1];

          // --- 上側の頂点 (direction: 1.0) ---
          stripData[offset++] = curr.x;
          stripData[offset++] = curr.y;
          stripData[offset++] = prev.x;
          stripData[offset++] = prev.y;
          stripData[offset++] = next.x;
          stripData[offset++] = next.y;
          stripData[offset++] = 1.0;

          // --- 下側の頂点 (direction: -1.0) ---
          stripData[offset++] = curr.x;
          stripData[offset++] = curr.y;
          stripData[offset++] = prev.x;
          stripData[offset++] = prev.y;
          stripData[offset++] = next.x;
          stripData[offset++] = next.y;
          stripData[offset++] = -1.0;
        }
        return stripData;
      }

      // 巨大データの作成
      console.time("Vertex Generation"); // 生成にかかった時間をログ出力
      const vertexData = buildMassiveLineVertices(points);
      console.timeEnd("Vertex Generation");

      // GPUバッファへの転送
      const vertexBuffer = device.createBuffer({
        size: vertexData.byteLength,
        usage: GPUBufferUsage.VERTEX,
        mappedAtCreation: true,
      });
      new Float32Array(vertexBuffer.getMappedRange()).set(vertexData);
      vertexBuffer.unmap();

      // ==========================================
      // 4. ユニフォームバッファの作成と状態管理（24バイトへ拡張）
      // ==========================================
      // offset(vec2: 8B) + scale(vec2: 8B) + canvas_size(vec2: 8B) = 計24バイト
      const uniformBuffer = device.createBuffer({
        size: 24,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });

      const viewState = {
        offsetX: 0.0,
        offsetY: 0.0,
        scaleX: 1.0,
        scaleY: 1.0,
      };

      // データをFloat32ArrayにまとめてGPUへ転送する関数
      function updateUniformBuffer() {
        const values = new Float32Array([
          viewState.offsetX,
          viewState.offsetY, // transform.u_offset
          viewState.scaleX,
          viewState.scaleY, // transform.u_scale
          canvas.width,
          canvas.height, // transform.u_canvas_size（★追加）
        ]);
        device.queue.writeBuffer(uniformBuffer, 0, values);
      }

      // 初期値をGPUに送信
      updateUniformBuffer();

      // ==========================================
      // Canvasサイズ（高さ）変更イベントの処理（アップデート版）
      // ==========================================
      const heightInput = document.getElementById("canvas-height");

      if (heightInput) {
        heightInput.addEventListener("input", (e) => {
          const newHeight = parseInt(e.target.value, 10);
          if (isNaN(newHeight) || newHeight < 200) return;

          // 1. Canvasのピクセルサイズを変更
          canvas.height = newHeight;

          // 2. WebGPUのバックバッファを新しいサイズに再構成
          context.configure({
            device: device,
            format: format,
            alphaMode: "opaque",
          });

          // 3. アスペクト比の変化に合わせて、画像の歪みを防ぐ補正
          const aspect = canvas.width / canvas.height;
          viewState.scaleY = viewState.scaleX / aspect;

          // 4. 新しいサイズ情報を含めてGPUへ送信・再描画
          updateUniformBuffer();
          requestAnimationFrame(render);
        });
      }

      // ==========================================
      // 5. テクスチャとサンプラーの作成（デモ画像自動生成）
      // ==========================================
      const texSize = 1000; // 1000x1000 サイズに変更
      const texture = device.createTexture({
        size: [texSize, texSize],
        format: "rgba8unorm",
        usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST,
      });

      const rgbaData = new Uint8Array(texSize * texSize * 4);
      const tileSize = 1; // 1マスのサイズ（100x100ピクセル）

      for (let y = 0; y < texSize; y++) {
        for (let x = 0; x < texSize; x++) {
          const i = (y * texSize + x) * 4;

          // 現在のピクセルが、縦横それぞれ何番目のタイルに属するかを計算
          const tileX = Math.floor(x / tileSize);
          const tileY = Math.floor(y / tileSize);

          // 白黒の判定（チェスボードのロジック）
          const isWhite = (tileX + tileY) % 2 === 0;
          const colorValue = isWhite ? 255 : 50; // 白（明るいグレー）か黒（暗いグレー）

          rgbaData[i] = colorValue; // R
          rgbaData[i + 1] = colorValue; // G
          rgbaData[i + 2] = colorValue; // B
          rgbaData[i + 3] = 255; // A（不透明）
        }
      }
      // GPUテクスチャへデータを転送（bytesPerRow は 1000ピクセル * 4バイト = 4000）
      device.queue.writeTexture(
        { texture },
        rgbaData,
        { bytesPerRow: texSize * 4 },
        [texSize, texSize],
      );

      const sampler = device.createSampler({
        magFilter: "nearest", // 拡大したときに境界がぼやけず、クッキリ（ドット絵風）見えるように変更
        minFilter: "linear",
      });

      // ==========================================
      // 6. パイプラインとバインドグループの設定
      // ==========================================
      const pipeline = device.createRenderPipeline({
        layout: "auto",
        vertex: {
          module: shaderModule,
          entryPoint: "vs_main",
          buffers: [
            {
              arrayStride: 28, // 7要素 * 4バイト = 28バイトストライド
              attributes: [
                {
                  shaderLocation: 0,
                  offset: 0,
                  format: "float32x2",
                }, // position (location 0)
                {
                  shaderLocation: 1,
                  offset: 8,
                  format: "float32x2",
                }, // prev     (location 1)
                {
                  shaderLocation: 2,
                  offset: 16,
                  format: "float32x2",
                }, // next     (location 2)
                {
                  shaderLocation: 3,
                  offset: 24,
                  format: "float32",
                }, // direction(location 3)
              ],
            },
          ],
        },
        fragment: {
          module: shaderModule,
          entryPoint: "fs_main",
          targets: [{ format: format }],
        },
        primitive: {
          topology: "triangle-strip",
        },
      });

      const bindGroup = device.createBindGroup({
        layout: pipeline.getBindGroupLayout(0),
        entries: [
          // ユニフォームバッファだけをバインドする
          { binding: 0, resource: { buffer: uniformBuffer } },
        ],
      });

      // ==========================================
      // 7. マウスイベント（PC対応：ピクセル空間基準）
      // ==========================================
      let isDragging = false;
      let lastMouseX = 0;
      let lastMouseY = 0;

      canvas.addEventListener("mousedown", (e) => {
        isDragging = true;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      });

      canvas.addEventListener("mousemove", (e) => {
        if (!isDragging) return;

        // マウスのピクセル移動量
        const deltaX = e.clientX - lastMouseX;
        const deltaY = e.clientY - lastMouseY;

        // ★修正：ピクセル空間に合わせ、canvas.width等での割り算を撤去！
        // マウスの移動ピクセルに現在の縮尺（scale）を直接掛け算する
        viewState.offsetX -= deltaX * viewState.scaleX;
        viewState.offsetY -= deltaY * viewState.scaleY;

        lastMouseX = e.clientX;
        lastMouseY = e.clientY;

        updateUniformBuffer();
        requestAnimationFrame(render);
      });

      window.addEventListener("mouseup", () => {
        isDragging = false;
      });

      canvas.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();

          const rect = canvas.getBoundingClientRect();
          const mouseX = e.clientX - rect.left;
          const mouseY = e.clientY - rect.top;

          const mouseVirtualX = mouseX * viewState.scaleX + viewState.offsetX;
          const mouseVirtualY = mouseY * viewState.scaleY + viewState.offsetY;

          const zoomFactor = e.deltaY < 0 ? 0.9 : 1.1111;
          const newScaleX = viewState.scaleX * zoomFactor;
          const newScaleY = viewState.scaleY * zoomFactor;

          if (newScaleX > 1.0 || newScaleY > 1.0) {
            viewState.scaleX = 1.0;
            viewState.scaleY = 1.0;
            viewState.offsetX = 0.0;
            viewState.offsetY = 0.0;
          } else {
            viewState.offsetX = mouseVirtualX - mouseX * newScaleX;
            viewState.offsetY = mouseVirtualY - mouseY * newScaleY;
            viewState.scaleX = newScaleX;
            viewState.scaleY = newScaleY;
          }

          updateUniformBuffer();
          requestAnimationFrame(render);
        },
        { passive: false },
      );

      // ==========================================
      // 7-2. タッチイベント（iPhone実機・バグ修正完全版）
      // ==========================================
      let touchStartDist = 0;

      // iPhone用にインデックス[0], [1]を厳密に指定して距離を計算
      function getTouchDistance(touches) {
        const t1 = touches[0];
        const t2 = touches[1];
        const dx = t1.clientX - t2.clientX;
        const dy = t1.clientY - t2.clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }

      // iPhone用にインデックス[0], [1]を厳密に指定して中心を計算
      function getTouchCenter(touches, rect) {
        const t1 = touches[0];
        const t2 = touches[1];
        const x = (t1.clientX + t2.clientX) / 2 - rect.left;
        const y = (t1.clientY + t2.clientY) / 2 - rect.top;
        return { x, y };
      }

      canvas.addEventListener(
        "touchstart",
        (e) => {
          if (e.cancelable) e.preventDefault();

          if (e.touches.length === 1) {
            // 1本指ドラッグ開始（touches[0]を明示）
            isDragging = true;
            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;
          } else if (e.touches.length === 2) {
            // 2本指ピンチ開始
            isDragging = false;
            touchStartDist = getTouchDistance(e.touches);
          }
        },
        { passive: false },
      );

      canvas.addEventListener(
        "touchmove",
        (e) => {
          if (e.cancelable) e.preventDefault();

          if (e.touches.length === 1 && isDragging) {
            // 1本指ドラッグ処理（touches[0]を明示 ＆ PC版と同じ数式に修正）
            const deltaX = e.touches[0].clientX - lastMouseX;
            const deltaY = e.touches[0].clientY - lastMouseY;

            viewState.offsetX -= deltaX * viewState.scaleX;
            viewState.offsetY -= deltaY * viewState.scaleY;

            lastMouseX = e.touches[0].clientX;
            lastMouseY = e.touches[0].clientY;

            updateUniformBuffer();
            requestAnimationFrame(render);
          } else if (e.touches.length === 2) {
            // 2本指ピンチズーム処理
            const rect = canvas.getBoundingClientRect();
            const center = getTouchCenter(e.touches, rect);

            const mouseVirtualX =
              center.x * viewState.scaleX + viewState.offsetX;
            const mouseVirtualY =
              center.y * viewState.scaleY + viewState.offsetY;

            const currentDist = getTouchDistance(e.touches);
            if (currentDist === 0) return;

            const zoomFactor = touchStartDist / currentDist;
            touchStartDist = currentDist; // 基準距離の更新

            const newScaleX = viewState.scaleX * zoomFactor;
            const newScaleY = viewState.scaleY * zoomFactor;

            if (newScaleX > 1.0 || newScaleY > 1.0) {
              viewState.scaleX = 1.0;
              viewState.scaleY = 1.0;
              viewState.offsetX = 0.0;
              viewState.offsetY = 0.0;
            } else {
              viewState.offsetX = mouseVirtualX - center.x * newScaleX;
              viewState.offsetY = mouseVirtualY - center.y * newScaleY;
              viewState.scaleX = newScaleX;
              viewState.scaleY = newScaleY;
            }

            updateUniformBuffer();
            requestAnimationFrame(render);
          }
        },
        { passive: false },
      );

      canvas.addEventListener("touchend", (e) => {
        if (e.touches.length === 0) {
          isDragging = false;
        } else if (e.touches.length === 1) {
          // 2本指から1本指に戻った時、その指の座標でドラッグを再開（touches[0]を明示）
          isDragging = true;
          lastMouseX = e.touches[0].clientX;
          lastMouseY = e.touches[0].clientY;
        }
      });

      // ==========================================
      // 8. 描画関数
      // ==========================================
      function render() {
        const commandEncoder = device.createCommandEncoder();
        const renderPass = commandEncoder.beginRenderPass({
          colorAttachments: [
            {
              view: context.getCurrentTexture().createView(),
              clearValue: { r: 0.1, g: 0.1, b: 0.1, a: 1.0 },
              loadOp: "clear",
              storeOp: "store",
            },
          ],
        });

        renderPass.setPipeline(pipeline);
        renderPass.setVertexBuffer(0, vertexBuffer);
        renderPass.setBindGroup(0, bindGroup);
        renderPass.draw(vertexData.length / 7);

        renderPass.end();
        device.queue.submit([commandEncoder.finish()]);
      }

      // 初回描画
      render();
    </script>
  </body>
</html>
