<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>WebGPU Vanilla Polyline & Polygon Renderer</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #1a1a1a;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <button
      id="regenButton"
      style="
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 10;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 5px;
        border: none;
        background: #007acd;
        color: white;
        font-weight: bold;
      "
    >
      図形を再生成
    </button>
    <canvas id="gpuCanvas"></canvas>

    <script src="index.min.js"></script>
  </body>
</html>
