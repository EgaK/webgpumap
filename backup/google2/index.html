<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>WebGPU Image Crop & Zoom</title>
        <style>
            body {
                margin: 0;
                background-color: #222;
                /*display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;*/
                overflow: hidden;
                color: white;
                font-family: sans-serif;
            }
            canvas {
                border: 2px solid #555;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
                cursor: grab;
            }
            canvas:active {
                cursor: grabbing;
            }
        </style>
    </head>
    <body>
        <div style="margin-bottom: 10px; color: white">
            <label for="canvas-height">Canvasの高さ: </label>
            <input
                type="number"
                id="canvas-height"
                value="600"
                min="200"
                max="2000"
                step="50"
            />
            px
        </div>
        <canvas id="webgpu-canvas" width="800" height="600"></canvas>

        <script type="module">
            // ==========================================
            // 1. WebGPU の初期化とデバイス取得
            // ==========================================
            const canvas = document.getElementById("webgpu-canvas");
            if (!navigator.gpu) {
                alert("お使いのブラウザはWebGPUに対応していません。");
                throw new Error("WebGPU not supported");
            }

            const adapter = await navigator.gpu.requestAdapter();
            const device = await adapter.requestDevice();
            const context = canvas.getContext("webgpu");
            const format = navigator.gpu.getPreferredCanvasFormat();

            context.configure({
                device: device,
                format: format,
                alphaMode: "opaque",
            });

            // ==========================================
            // 2. WGSL シェーダーの定義
            // ==========================================
            const shaderModule = device.createShaderModule({
                code: `
                    struct Transform {
                        u_offset: vec2<f32>,
                        u_scale: vec2<f32>,
                    };

                    @group(0) @binding(0) var<uniform> transform: Transform;
                    @group(0) @binding(1) var my_texture: texture_2d<f32>;
                    @group(0) @binding(2) var my_sampler: sampler;

                    struct VertexInput {
                        @location(0) position: vec2<f32>,
                        @location(1) base_uv: vec2<f32>,
                    };

                    struct VertexOutput {
                        @builtin(position) position: vec4<f32>,
                        @location(0) uv: vec2<f32>,
                    };

                    @vertex
                    fn vs_main(input: VertexInput) -> VertexOutput {
                        var output: VertexOutput;
                        output.position = vec4<f32>(input.position, 0.0, 1.0);
                        output.uv = input.base_uv * transform.u_scale + transform.u_offset;
                        return output;
                    }

                    @fragment
                    fn fs_main(input: VertexOutput) -> @location(0) vec4<f32> {
                        return textureSample(my_texture, my_sampler, input.uv);
                    }
                `,
            });

            // ==========================================
            // 3. 固定頂点バッファの作成（不変）
            // ==========================================
            const vertexData = new Float32Array([
                -1.0,
                1.0,
                0.0,
                0.0, // 左上
                -1.0,
                -1.0,
                0.0,
                1.0, // 左下
                1.0,
                1.0,
                1.0,
                0.0, // 右上
                1.0,
                -1.0,
                1.0,
                1.0, // 右下
            ]);

            const vertexBuffer = device.createBuffer({
                size: vertexData.byteLength,
                usage: GPUBufferUsage.VERTEX,
                mappedAtCreation: true,
            });
            new Float32Array(vertexBuffer.getMappedRange()).set(vertexData);
            vertexBuffer.unmap();

            // ==========================================
            // 4. ユニフォームバッファの作成と状態管理
            // ==========================================
            const uniformBuffer = device.createBuffer({
                size: 16,
                usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
            });

            const viewState = {
                offsetX: 0.0,
                offsetY: 0.0,
                scaleX: 1.0,
                scaleY: 1.0,
            };

            function updateUniformBuffer() {
                const values = new Float32Array([
                    viewState.offsetX,
                    viewState.offsetY,
                    viewState.scaleX,
                    viewState.scaleY,
                ]);
                device.queue.writeBuffer(uniformBuffer, 0, values);
            }
            updateUniformBuffer();

            // ==========================================
            // 追加：Canvasサイズ（高さ）変更イベントの処理
            // ==========================================
            const heightInput = document.getElementById("canvas-height");

            heightInput.addEventListener("input", (e) => {
                const newHeight = parseInt(e.target.value, 10);
                if (isNaN(newHeight) || newHeight < 200) return;

                // 1. Canvas自体のサイズを変更
                canvas.height = newHeight;

                // 2. 【重要】WebGPUのバックバッファ（テクスチャ）サイズを新しいCanvasに追従させる
                context.configure({
                    device: device,
                    format: format,
                    alphaMode: "opaque",
                });

                // 3. アスペクト比の変化に合わせて、切り取り範囲（Scale）を補正する（画像の歪み防止）
                // Canvasが縦長になったら、画像の縦方向の表示範囲（ScaleY）を広げてアスペクト比を維持します
                const aspect = canvas.width / canvas.height;

                // 例：横幅基準で表示範囲を合わせる場合（画像全体がはみ出さないようにクランプ処理と組み合わせる）
                viewState.scaleY = viewState.scaleX / aspect;

                // 4. 新しい設定値をGPUに送信して即座に再描画
                updateUniformBuffer();
                requestAnimationFrame(render);
            });

            // ==========================================
            // 5. テクスチャとサンプラーの作成（デモ画像自動生成）
            // ==========================================
            const texSize = 1000; // 1000x1000 サイズに変更
            const texture = device.createTexture({
                size: [texSize, texSize],
                format: "rgba8unorm",
                usage:
                    GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST,
            });

            const rgbaData = new Uint8Array(texSize * texSize * 4);
            const tileSize = 1; // 1マスのサイズ（100x100ピクセル）

            for (let y = 0; y < texSize; y++) {
                for (let x = 0; x < texSize; x++) {
                    const i = (y * texSize + x) * 4;

                    // 現在のピクセルが、縦横それぞれ何番目のタイルに属するかを計算
                    const tileX = Math.floor(x / tileSize);
                    const tileY = Math.floor(y / tileSize);

                    // 白黒の判定（チェスボードのロジック）
                    const isWhite = (tileX + tileY) % 2 === 0;
                    const colorValue = isWhite ? 255 : 50; // 白（明るいグレー）か黒（暗いグレー）

                    rgbaData[i] = colorValue; // R
                    rgbaData[i + 1] = colorValue; // G
                    rgbaData[i + 2] = colorValue; // B
                    rgbaData[i + 3] = 255; // A（不透明）
                }
            }
            // GPUテクスチャへデータを転送（bytesPerRow は 1000ピクセル * 4バイト = 4000）
            device.queue.writeTexture(
                { texture },
                rgbaData,
                { bytesPerRow: texSize * 4 },
                [texSize, texSize],
            );

            const sampler = device.createSampler({
                magFilter: "nearest", // 拡大したときに境界がぼやけず、クッキリ（ドット絵風）見えるように変更
                minFilter: "linear",
            });

            // ==========================================
            // 6. パイプラインとバインドグループの設定
            // ==========================================
            const pipeline = device.createRenderPipeline({
                layout: "auto",
                vertex: {
                    module: shaderModule,
                    entryPoint: "vs_main",
                    buffers: [
                        {
                            arrayStride: 16,
                            attributes: [
                                {
                                    shaderLocation: 0,
                                    offset: 0,
                                    format: "float32x2",
                                },
                                {
                                    shaderLocation: 1,
                                    offset: 8,
                                    format: "float32x2",
                                },
                            ],
                        },
                    ],
                },
                fragment: {
                    module: shaderModule,
                    entryPoint: "fs_main",
                    targets: [{ format: format }],
                },
                primitive: {
                    topology: "triangle-strip",
                },
            });

            const bindGroup = device.createBindGroup({
                layout: pipeline.getBindGroupLayout(0),
                entries: [
                    { binding: 0, resource: { buffer: uniformBuffer } },
                    { binding: 1, resource: texture.createView() },
                    { binding: 2, resource: sampler },
                ],
            });

            // ==========================================
            // 7. マウスイベント（ドラッグ ＆ マウス位置基準ズーム）
            // ==========================================
            let isDragging = false;
            let lastMouseX = 0;
            let lastMouseY = 0;

            canvas.addEventListener("mousedown", (e) => {
                isDragging = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });

            canvas.addEventListener("mousemove", (e) => {
                if (!isDragging) return;

                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;

                const uvDeltaX = (deltaX / canvas.width) * viewState.scaleX;
                const uvDeltaY = (deltaY / canvas.height) * viewState.scaleY;

                viewState.offsetX -= uvDeltaX;
                viewState.offsetY -= uvDeltaY;

                lastMouseX = e.clientX;
                lastMouseY = e.clientY;

                updateUniformBuffer();
                requestAnimationFrame(render);
            });

            window.addEventListener("mouseup", () => {
                isDragging = false;
            });

            canvas.addEventListener(
                "wheel",
                (e) => {
                    e.preventDefault();

                    const rect = canvas.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;

                    const mouseRatioX = mouseX / canvas.width;
                    const mouseRatioY = mouseY / canvas.height;
                    const mouseUVX =
                        mouseRatioX * viewState.scaleX + viewState.offsetX;
                    const mouseUVY =
                        mouseRatioY * viewState.scaleY + viewState.offsetY;

                    const zoomFactor = e.deltaY < 0 ? 0.9 : 1.1111;

                    const newScaleX = viewState.scaleX * zoomFactor;
                    const newScaleY = viewState.scaleY * zoomFactor;

                    // ==========================================
                    // 追記：最大限の縮小制限（画像全体より小さくしない）
                    // ==========================================
                    if (newScaleX > 1.0 || newScaleY > 1.0) {
                        // スケールを最大値（画像全体）である1.0に固定する
                        viewState.scaleX = 1.0;
                        viewState.scaleY = 1.0;
                        // 画像全体が中央（または左上[0,0]）にぴったり収まるようにオフセットもリセット
                        viewState.offsetX = 0.0;
                        viewState.offsetY = 0.0;
                    } else {
                        // 通常の拡大・縮小範囲なら、計算した値をそのまま適用
                        viewState.offsetX = mouseUVX - mouseRatioX * newScaleX;
                        viewState.offsetY = mouseUVY - mouseRatioY * newScaleY;
                        viewState.scaleX = newScaleX;
                        viewState.scaleY = newScaleY;
                    }

                    updateUniformBuffer();
                    requestAnimationFrame(render);
                },
                { passive: false },
            );
            // ==========================================
            // 7-2. タッチイベント（スマホ対応：ドラッグ ＆ ピンチズーム）
            // ==========================================
            let touchStartDist = 0; // ピンチ開始時の指と指の距離
            let touchStartScaleX = 1.0;
            let touchStartScaleY = 1.0;

            // 2つのタッチ点（指）の間の距離を計算するヘルパー関数
            function getTouchDistance(touch1, touch2) {
                const dx = touch1.clientX - touch2.clientX;
                const dy = touch1.clientY - touch2.clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            // 2つのタッチ点（指）の中間座標（Canvas内）を計算するヘルパー関数
            function getTouchCenter(touch1, touch2, rect) {
                const x = (touch1.clientX + touch2.clientX) / 2 - rect.left;
                const y = (touch1.clientY + touch2.clientY) / 2 - rect.top;
                return { x, y };
            }

            // --- タッチ開始 ---
            canvas.addEventListener(
                "touchstart",
                (e) => {
                    // 画面スクロールなどのデフォルト挙動を防止
                    if (e.cancelable) e.preventDefault();

                    if (e.touches.length === 1) {
                        // 1本指の場合：ドラッグ開始
                        isDragging = true;
                        lastMouseX = e.touches[0].clientX;
                        lastMouseY = e.touches[0].clientY;
                    } else if (e.touches.length === 2) {
                        // 2本指の場合：ピンチ（ズーム）開始
                        isDragging = false; // ドラッグは中断
                        touchStartDist = getTouchDistance(
                            e.touches[0],
                            e.touches[1],
                        );
                        touchStartScaleX = viewState.scaleX;
                        touchStartScaleY = viewState.scaleY;
                    }
                },
                { passive: false },
            );

            // --- タッチ移動中 ---
            canvas.addEventListener(
                "touchmove",
                (e) => {
                    if (e.cancelable) e.preventDefault();

                    if (e.touches.length === 1 && isDragging) {
                        // 【1本指：ドラッグ処理】（マウスのmousemoveと全く同じロジック）
                        const deltaX = e.touches[0].clientX - lastMouseX;
                        const deltaY = e.touches[0].clientY - lastMouseY;

                        const uvDeltaX =
                            (deltaX / canvas.width) * viewState.scaleX;
                        const uvDeltaY =
                            (deltaY / canvas.height) * viewState.scaleY;

                        viewState.offsetX -= uvDeltaX;
                        viewState.offsetY -= uvDeltaY;

                        lastMouseX = e.touches[0].clientX;
                        lastMouseY = e.touches[0].clientY;

                        updateUniformBuffer();
                        requestAnimationFrame(render);
                    } else if (e.touches.length === 2) {
                        // 【2本指：ピンチズーム処理】
                        const rect = canvas.getBoundingClientRect();

                        // 1. 二本の指の中間点を「ズームの中心ポインタ」とする
                        const center = getTouchCenter(
                            e.touches[0],
                            e.touches[1],
                            rect,
                        );

                        // 2. 現在の中心点が指している表示範囲（UV座標）を特定
                        const mouseRatioX = center.x / canvas.width;
                        const mouseRatioY = center.y / canvas.height;
                        const mouseUVX =
                            mouseRatioX * viewState.scaleX + viewState.offsetX;
                        const mouseUVY =
                            mouseRatioY * viewState.scaleY + viewState.offsetY;

                        // 3. ピンチの拡大率を計算 (開始時からの指の距離の変化比率)
                        const currentDist = getTouchDistance(
                            e.touches[0],
                            e.touches[1],
                        );
                        if (currentDist === 0) return;

                        // 指が広がれば zoomFactor は 1未満（切り取り範囲が狭くなる＝拡大）
                        const zoomFactor = touchStartDist / currentDist;

                        // 4. 新しい拡大率を計算
                        let newScaleX = touchStartScaleX * zoomFactor;
                        let newScaleY = touchStartScaleY * zoomFactor;

                        // 5. 最大縮小制限（画像全体より小さくしないクランプ処理）
                        if (newScaleX > 1.0 || newScaleY > 1.0) {
                            viewState.scaleX = 1.0;
                            viewState.scaleY = 1.0;
                            viewState.offsetX = 0.0;
                            viewState.offsetY = 0.0;
                        } else {
                            // 2本指の中心からズレないようにOffsetX/Yを逆算
                            viewState.offsetX =
                                mouseUVX - mouseRatioX * newScaleX;
                            viewState.offsetY =
                                mouseUVY - mouseRatioY * newScaleY;
                            viewState.scaleX = newScaleX;
                            viewState.scaleY = newScaleY;
                        }

                        updateUniformBuffer();
                        requestAnimationFrame(render);
                    }
                },
                { passive: false },
            );

            // --- タッチ終了 ---
            canvas.addEventListener("touchend", (e) => {
                if (e.touches.length === 0) {
                    isDragging = false;
                } else if (e.touches.length === 1) {
                    // 2本指から1本指に戻った場合、その指の位置でドラッグを再開できるようにする
                    isDragging = true;
                    lastMouseX = e.touches[0].clientX;
                    lastMouseY = e.touches[0].clientY;
                }
            });
            // ==========================================
            // 8. 描画関数
            // ==========================================
            function render() {
                const commandEncoder = device.createCommandEncoder();
                const renderPass = commandEncoder.beginRenderPass({
                    colorAttachments: [
                        {
                            view: context.getCurrentTexture().createView(),
                            clearValue: { r: 0.1, g: 0.1, b: 0.1, a: 1.0 },
                            loadOp: "clear",
                            storeOp: "store",
                        },
                    ],
                });

                renderPass.setPipeline(pipeline);
                renderPass.setVertexBuffer(0, vertexBuffer);
                renderPass.setBindGroup(0, bindGroup);
                renderPass.draw(4);

                renderPass.end();
                device.queue.submit([commandEncoder.finish()]);
            }

            // 初回描画
            render();
        </script>
    </body>
</html>
